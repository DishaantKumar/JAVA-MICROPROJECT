<!DOCTYPE html>
<html>
<head>
    <title>Java Powered Campus Splitter</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 20px auto; padding: 20px; background: #f4f6f4; color: #222; }
        .card { background: white; padding: 16px; margin-bottom: 16px; border-radius: 6px; border: 1px solid #dcd; }
        input, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #24634e; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #1a4a3a; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    </style>
</head>
<body>
    <h2>🤝 Campus Bill Splitter (Java Core Engine)</h2>
    <div id="status" style="font-weight: bold; color: #24634e; margin-bottom: 10px;"></div>

    <div class="grid">
        <div class="card">
            <h4>1. Add Friends (Comma separated)</h4>
            <form onsubmit="sendAction(event, 'addMembers', this)">
                <input name="names" placeholder="Amit, Rahul, Sneha" required>
                <button type="submit">Add to Group</button>
            </form>
        </div>

        <div class="card">
            <h4>2. Split a New Bill</h4>
            <form onsubmit="sendAction(event, 'splitBill', this)">
                <input name="desc" placeholder="Pizza Party" required>
                <input name="amount" type="number" step="0.01" placeholder="Amount (INR)" required>
                <input name="payer" placeholder="Who paid upfront?" required>
                <input name="category" placeholder="Food" required>
                <input name="sharedWith" placeholder="Who split? (Blank = all)">
                <button type="submit">Log Expense</button>
            </form>
        </div>

        <div class="card">
            <h4>3. Record Direct Cash Handover</h4>
            <form onsubmit="sendAction(event, 'handover', this)">
                <input name="from" placeholder="Who gave cash?" required>
                <input name="to" placeholder="Who received cash?" required>
                <input name="amount" type="number" step="0.01" placeholder="Amount (INR)" required>
                <button type="submit">Record Payment</button>
            </form>
        </div>

        <!-- Dynamic output stream rendered entirely by Java computations -->
        <div class="card" style="background: #fafbfa;">
            <h4>📊 Live Java Analytics & Standings</h4>
            <button onclick="refreshUI()">Compute & Refresh Board</button>
            <div id="output-display" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        async function sendAction(event, actionName, formElement) {
            if(event) event.preventDefault();
            let formData = new URLSearchParams(new FormData(formElement));
            formData.append("action", actionName);
            
            try {
                let res = await fetch('/api/action', { method: 'POST', body: formData });
                let text = await res.text();
                document.getElementById('status').innerText = text;
                refreshUI();
                if(formElement) formElement.reset();
            } catch(e) {
                document.getElementById('status').innerText = "❌ Connection error.";
            }
        }

        async function refreshUI() {
            let res = await fetch('/api/action', { method: 'POST', body: new URLSearchParams({ action: 'getUIState' }) });
            document.getElementById('output-display').innerHTML = await res.text();
        }
        window.onload = refreshUI;
    </script>
</body>
</html>
